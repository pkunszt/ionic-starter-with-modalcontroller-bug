<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ folder }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-button (click)="openModal = true">Modal Inline</ion-button>
    <ion-button (click)="openUsingController()">Modal via Controller</ion-button>
  </div>
</ion-content>
<ion-modal [isOpen]="openModal" (didDismiss)="openModal=false">
  <ng-template>
    <app-test-modal></app-test-modal>
  </ng-template>
</ion-modal>
